enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5_0526.xml
auto_aim_device: GPU
omni_device: GPU
classifier_device: GPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi:
  x: 420
  y: 350
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 25
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
gimbal_axis_order: pitch_yaw # yaw_pitch: yaw轴在外；pitch_yaw: pitch轴在外

yaw_offset: 2.3 # degree -2.5
pitch_offset: -3.0 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
resistance_k: 0.023 # 空气阻力系数
traj_g: 9.7833 # m/s^2，弹道重力加速度
decision_speed: 8 # rad/s
high_speed_delay_time: 0.073 # s
low_speed_delay_time: 0.08 # s
outpost_prediction_offset_s: -0.055 # s，仅前哨站；负值减小提前量

#####-----shooter参数-----#####
auto_fire: true

high_spin_force_fire_enabled: true
high_spin_force_fire_enter_speed: 11.0 # rad/s
high_spin_force_fire_exit_speed: 9.0 # rad/s

outpost_fire_require_locked: true
outpost_fire_enter_angle: 45.0 # degree
outpost_fire_exit_angle: 70.0 # degree

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 5
gain: 15
vid_pid: "2bdf:0001"

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1404px
# K、畸变、R 按原始图像坐标：x向右、y向下、z向前
camera_matrix: [2360.4173834518401, 0, 703.64012002435209, 0, 2357.7451996061423, 595.0989454562266, 0, 0, 1]
distort_coeffs: [-0.067541223949940096, 0.29506677289645661, 0.0020765625950380016, -0.0011925081223193895, 0]

# python3 euler_to_matrix.py --yaw 0.45 --pitch 1.3 --roll 0 --ascento
# 相机偏角: yaw-15.40 pitch5.06 roll80.99 degree
R_camera2gimbal: [-0.060700121050418908, 0.059370918995186428, 0.99638877416505012,
  -0.99815604757195375, -0.0036104795223641062, -0.060592649167651495,
  -0, -0.99822946180489258, 0.059480598389007482]
t_camera2gimbal: [0.11541496769213655, 0.004315072306283558, -0.03708342385366079]

#####-----USB相机参数-----#####
image_width: 1440
image_height: 1080
usb_frame_rate: 50
usb_exposure: 200 # 1-80000
usb_gamma: 160
usb_gain: 20 # 0-96
usb_max_reopen_attempts: 0 # 0为持续重连
omni_camera_read_timeout_ms: 10

omni_right_path: "/dev/video0"
omni_left_path: "/dev/video2"
omni_back_path: ""
omni_left_yaw_deg: 120.0
omni_right_yaw_deg: -120.0
omni_back_yaw_deg: 180.0
omni_fov_h_deg: 120.0
omni_fov_v_deg: 67.0

#####-----时序参数-----#####
timing:
  offset: 0.001 # s，图像时间戳到姿态查询的补偿

#####-----ROS2云台桥参数-----#####
ros2_gimbal:
  node_name: "nav_gimbal_bridge"
  status_topic: "/serial/gimbal_status"
  cmd_topic: "/serial/process_gimbal"
  imu_world_yaw_offset_deg: -180.0 # IMU世界yaw相对电控零位
  status_msg_type: "rm_interfaces/msg/Gimbal" # big_yaw在yaw与mode之间，单位degree
  cmd_msg_type: "rm_interfaces/msg/GimbalCmd"

#####-----decider参数-----#####
mode: 1
omni_retarget_cooldown_s: 2.5 # s，大幅重定向冷却
omni_retarget_min_delta_deg: 20.0 # degree，超过才算一次大幅重定向
omni_hold_release_tolerance_deg: 3.0 # degree，big_yaw到位后释放hold
omni_command_timeout_s: 0.5 # s，超时则停止并保持lost
main_lost_cmd_hold_s: 0.25 # s，主相机lost后继续发上一条命令

#####-----buff_detector参数-----#####
small_buff_model: "assets/yolo11_buff_int8.xml"
big_buff_model: "assets/yolo11-buff-nano-v8_red.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.520 # s
predict_time: 0.100 # s
yaw_offset_buff: 2.3 # degree
pitch_offset_buff: -0.5 # degree

#####-----planner-----#####
fire_thresh: 2.0 # degree，分段关闭时的默认阈值

is_multiple_thresh: true
planner_judge_distance: [2.5, 5.0, 100] # m
planner_fire_thresh: [4.0, 2.0, 0.6] # degree
# 近 / 中 / 远三档。距离小于该档时用对应阈值，超过最后一档用最后一档
# 中距离沿用原来的 2°；近距离放宽，远距离收紧
mpc_takeover_time_s: 0.20 # s，锁定后平滑接管
mpc_gimbal_status_timeout_s: 0.20 # s，状态超时则关闭MPC
mpc_pitch_min_deg: -60.0 # 负值为抬头
mpc_pitch_max_deg: 30.0

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]
mpc_max_iter: 20 # 未收敛禁止开火
